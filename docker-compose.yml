services:
  ai-api-stuff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-api-stuff
    privileged: false

    cap_add:
      - SYS_ADMIN
    shm_size: '2gb' # Для ML-задач это мастхэв, чтобы не было ошибок памяти

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu, utility, compute]
    devices:
      - /dev/nvidia0:/dev/nvidia0       # Прокидываем именно ноду Neptune
      - /dev/nvidiactl:/dev/nvidiactl   # Общий контроллер (нужен всегда)
      - /dev/nvidia-uvm:/dev/nvidia-uvm # Для работы с памятью (нужен всегда)
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools # Добавь этот узел для инструментов мониторинга
  
    environment:
      - NVIDIA_VISIBLE_DEVICES=0 # Явно укажем переменную окружения
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_API_KEY} # берётся из .env в корне — снимает rate-limit при холодной закачке весов
      # Потолок на HEAD-запрос к huggingface.co при сверке ревизий (по умолчанию 10 с
      # НА ФАЙЛ). Модель из сотни шардов при недоступной сети складывала эти таймауты
      # в 978 с загрузки вместо 5.5 с. Скачиванию не мешает — только ограничивает
      # ожидание. Картинки вдобавок грузятся кэш-сначала (см. _from_cache_first).
      - HF_HUB_ETAG_TIMEOUT=3
      - COMFYUI_URL=http://comfyui:8188 # куда слать видео-воркфлоу

    ports:
      - 8000:8000

    volumes:
      - .:/root

    depends_on:
      - comfyui

    command: ["fastapi", "run", "main.py", "--port", "8000", "--no-reload"]

    restart: unless-stopped

    # <<: *default-logging

  # ------------------------------------------------------------------------
  # ComfyUI — мотор видео-генерации (fp8_scaled). Делит GPU 0 с ai-api-stuff;
  # наш воркер шлёт сюда воркфлоу и дёргает /free на границах, чтобы отдавать
  # VRAM под картинки/аудио. Порт наружу не обязателен (общаемся по сети compose).
  # ------------------------------------------------------------------------
  comfyui:
    build:
      context: ./comfyui
      dockerfile: Dockerfile
    container_name: comfyui

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']          # та же карта, что у ai-api-stuff
              capabilities: [gpu, utility, compute]
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools

    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      # модели качаются скриптом comfyui/download_models.sh в ./comfyui/models/
      - ./comfyui/models:/opt/ComfyUI/models
      - ./comfyui/output:/opt/ComfyUI/output

    # Переопределяем CMD образа, чтобы менять флаги без пересборки: Dockerfile
    # клонирует ComfyUI по --depth 1 с HEAD, и пересборка притащила бы другую
    # версию вместо работающей 0.31.0.
    #
    # --disable-pinned-memory УБРАН. Он ставился против OOM-killer'а на длинных
    # клипах H3, но наша нагрузка — 124 кадра (5 с), там до потолка RAM далеко.
    # Ценой была скорость: без page-locked памяти "async weight offloading"
    # не может делать асинхронный DMA, копии CPU<->GPU идут через промежуточный
    # буфер драйвера и не перекрываются со счётом. Замер на медленной фазе:
    # GPU 0%, шина ~0, одно ядро на 75-100%. Если OOM всё же вернётся —
    # не возвращай флаг, а ограничь потолок пиннинга: --cache-ram 6 32
    # (по умолчанию порог inactive/pin = 100% системной RAM).
    # --reserve-vram НЕ ставить. Проверено 2026-08-22: с "--reserve-vram 14"
    # (столько нужно картиночной модели с enable_model_cpu_offload, пик 12.9 ГБ)
    # у ComfyUI остаётся ~10 ГБ на 20-гигабайтную H3, и фаза диффузии
    # растягивается со 175 с до 450+ с при GPU в нуле и 127 Вт — модель
    # стримится через шину непрерывно. Размен невыгоден: чинит редкий случай
    # (картинка между видео) ценой частого (серия видео за 160 с).
    # --disable-mmap НЕ ставить, хотя соблазн есть. Проверено 2026-08-22:
    # тёплое видео ускоряется вдвое (159.7 -> 88.0 с), потому что без mmap ядро
    # не вытесняет страницы весов прямо во время генерации. НО веса становятся
    # анонимной памятью: ComfyUI держит ~45 ГБ, page cache вытесняется, и
    # следующая КАРТИНКА грузится с диска — 338+ с вместо 14. То есть флаг
    # возвращает исходную жалобу «картинка висит минутами». Плюс анонимную
    # память ядро не может отдать под давлением — только в своп.
    command: ["python3", "main.py", "--listen", "0.0.0.0", "--port", "8188",
              "--fp16-intermediates"]

    # порт наружу не обязателен (общаемся по сети compose); раскомментируй для веб-UI:
    ports:
      - 8188:8188

    restart: unless-stopped
