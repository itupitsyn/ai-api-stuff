# x-def-logging: &default-logging
#   logging:
#     driver: "loki"
#     options:
#       loki-url: "http://192.168.1.86:3100/loki/api/v1/push"
#       loki-batch-size: "400"

services:
  ai-api-stuff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-api-stuff
    privileged: false

    cap_add:
      - SYS_ADMIN
    shm_size: '2gb' # Для ML-задач это мастхэв, чтобы не было ошибок памяти

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # count: all, а не список — сервису нужны ВСЕ карты, а какую взять,
              # каждый дочерний процесс решает сам через CUDA_VISIBLE_DEVICES.
              # Список пришлось бы править под каждое железо; узлы /dev/nvidiaN
              # прокидывает сам nvidia-runtime, перечислять их не нужно.
              count: all
              capabilities: [gpu, utility, compute]
  
    environment:
      - NVIDIA_VISIBLE_DEVICES=all # какие использовать — решает GPU_DEVICES ниже
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Пул карт и адреса их ComfyUI — парами по порядку. Одна карта и один
      # COMFYUI_URL — прежняя однокарточная конфигурация, код её поддерживает.
      # Одна карта — конфигурация по умолчанию, файл рабочий как есть.
      # Больше карт добавляет docker-compose.override.yml: сгенерируй его
      # скриптом gen-gpu-override.sh, он же перепишет эти две переменные.
      - GPU_DEVICES=0
      - COMFYUI_URLS=http://comfyui-0:8188
      # Потолок одновременных видео. Пусто — считается от MemTotal: одно видео
      # просит около 40 ГБ staging-буферов, делить их между экземплярами нельзя.
      # Поставь число, чтобы перекрыть расчёт; 0 — снять потолок совсем.
      # - MAX_CONCURRENT_VIDEO=1
      # Картиночная модель: chroma_flash (по умолчанию) | z_image.
      # Реестр и параметры каждой — в IMAGE_MODELS в main.py. Откат на Z-Image:
      # раскомментировать строку ниже и перезапустить сервис, веса останутся в кэше.
      # - IMAGE_MODEL=z_image
      # Учёт задач. Источник истины — локальная SQLite рядом с сервисом;
      # DSN говорит лишь, КУДА отвозить строки для дашборда. Не задан —
      # экспорт выключен, а сам учёт работает как ни в чём не бывало:
      # генерация не должна зависеть от наблюдательной машины.
      - STATS_PG_DSN=${STATS_PG_DSN:-}
      - NODE_NAME=${NODE_NAME:-}
      # Удалённые узлы пула: JSON-список {"name", "comfy"}. Адреса в .env,
      # не здесь. Пусто — пул только из локальных карт, как было.
      - VIDEO_NODES=${VIDEO_NODES:-[]}
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_API_KEY} # берётся из .env в корне — снимает rate-limit при холодной закачке весов
      # Потолок на HEAD-запрос к huggingface.co при сверке ревизий (по умолчанию 10 с
      # НА ФАЙЛ). Модель из сотни шардов при недоступной сети складывала эти таймауты
      # в 978 с загрузки вместо 5.5 с. Скачиванию не мешает — только ограничивает
      # ожидание. Картинки вдобавок грузятся кэш-сначала (см. _from_cache_first).
      - HF_HUB_ETAG_TIMEOUT=3
      # Аллокатор CUDA по умолчанию режет память на сегменты фиксированного
      # размера и фрагментируется: Chroma занимает 23.1 из 23.5 ГБ, и при
      # активациях не хватало 54 МБ при формально свободных сотнях мегабайт.
      # expandable_segments отдаёт сегменты растущими, фрагментация уходит.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    ports:
      - 8000:8000

    volumes:
      - .:/root

    depends_on:
      - comfyui-0

    command: ["fastapi", "run", "main.py", "--port", "8000", "--no-reload"]

    restart: unless-stopped

    # <<: *default-logging

  # ComfyUI-сервисы здесь НЕ описаны: их по одному на карту генерирует
  # gen-gpu-override.sh в docker-compose.override.yml. Держать нулевую карту
  # тут, а остальные в генераторе, значит дублировать строку запуска — и рано
  # или поздно карты разъедутся по флагам молча, проявившись как «вторая почему-то
  # медленнее». Поэтому источник правды один, и он в скрипте.
  #
  #     bash gen-gpu-override.sh
  #     docker compose up -d --remove-orphans
  #
  # Без сгенерированного override compose честно откажется стартовать: у API в
  # depends_on стоит comfyui-0, которого он не найдёт.
